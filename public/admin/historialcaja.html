<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Historial de Cierres — Sistema Gestión PRO</title>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body class="histcaja-page">

  <main class="hc-wrap">

    <div class="hc-topbar">
      <div>
        <h1 class="hc-title">📅 Historial de Cierres</h1>
        <p class="hc-sub">Registro de todas las sesiones de caja</p>
      </div>
      <span id="hc-stat" class="hc-stat">— sesiones</span>
    </div>

    <div class="panel">
      <div class="tbl-wrap">
        <table class="tbl">
          <thead>
            <tr>
              <th>#</th>
              <th>Apertura</th>
              <th>Cierre</th>
              <th>Usuario</th>
              <th class="right">Inicial</th>
              <th class="right">Ventas ef.</th>
              <th class="right">Esperado</th>
              <th class="right">Conteo</th>
              <th class="right">Diferencia</th>
              <th class="center">Estado</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr>
              <td colspan="10">
                <div class="empty-state">
                  <span class="empty-icon">📅</span>
                  <span>Cargando historial…</span>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/auth-guard.js" data-rol="admin"></script>
  <script src="../js/navbar.js"></script>
  <script src="/js/historialcaja.js"></script>
</body>
</html>
