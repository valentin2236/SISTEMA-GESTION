<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clientes</title>
    <link rel="stylesheet" href="../css/main.css" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <div>
      <div class="page-wrap">
        <div class="page-header">
          <h1>👥 Clientes</h1>
        </div>
        <section class="panel toolbar-panel">
          <input
            type="text"
            id="search"
            placeholder="Buscar cliente..."
            class="search"
          />

          <button id="btnNuevo" class="btn btn-primary">+ Nuevo Cliente</button>
          <button id="btnExportar" class="btn btn-success">
            Exportar Excel
          </button>
        </section>

        <section class="panel">
          <table class="tbl">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>DNI</th>
                <th>Acciones</th>
              </tr>
            </thead>

            <tbody id="tbodyClientes"></tbody>
          </table>
        </section>
      </div>
    </div>

    <!-- MODAL -->

    <div class="modal hidden" id="modalCliente">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">Nuevo Cliente</h2>

          <button id="cerrarModal" class="btn-close">✖</button>
        </div>

        <form id="formCliente">
          <input type="hidden" id="clienteId" />

          <div class="form-group">
            <label>Nombre</label>
            <input type="text" id="nombre" required />
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" />
          </div>

          <div class="form-group">
            <label>Teléfono</label>
            <input type="text" id="telefono" />
          </div>

          <div class="form-group">
            <label>DNI</label>
            <input type="text" id="dni" />
          </div>

          <div class="form-group">
            <label>Dirección</label>
            <input type="text" id="direccion" />
          </div>

          <button type="submit" class="btn-save">Guardar Cliente</button>
        </form>
      </div>
    </div>

    <!-- MODAL HISTORIAL -->

    <div class="modal hidden" id="modalHistorial">
      <div class="modal-content historial-modal">
        <div class="modal-header">
          <h2>Historial de Compras</h2>

          <button id="cerrarHistorial" class="btn-close">✖</button>
        </div>

        <div id="historialContent"></div>
      </div>
    </div>

    <!-- MODAL CUENTA CORRIENTE -->

    <div class="modal hidden" id="modalCuenta">
      <div class="modal-content cuenta-modal">
        <div class="modal-header">
          <h2>Cuenta Corriente</h2>

          <button id="cerrarCuenta" class="btn-close">✖</button>
        </div>

        <div id="cuentaContent"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script src="../js/clientes.js"></script>
    <script src="../js/navbar.js"></script>
  </body>
</html>
