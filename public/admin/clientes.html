<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Clientes — Sistema Gestión PRO</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="clientes-page">

  <main class="cli-wrap">

    <div class="cli-topbar">
      <div>
        <h1 class="cli-title">👥 Clientes</h1>
        <p class="cli-sub">Gestión de clientes y cuentas corrientes</p>
      </div>
      <div class="cli-topbar-actions">
        <button id="btnNuevo" class="btn btn-primary">+ Nuevo cliente</button>
        <button id="btnExportar" class="btn btn-outline">📊 Exportar Excel</button>
      </div>
    </div>

    <!-- Buscador -->
    <div class="panel cli-search-panel">
      <input type="text" id="search" class="field-input cli-search-input" placeholder="🔍 Buscar por nombre, email, teléfono o DNI..."/>
    </div>

    <!-- Tabla -->
    <div class="panel">
      <div class="tbl-wrap">
        <table class="tbl">
          <thead>
            <tr>
              <th class="col-id">#</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Teléfono</th>
              <th>DNI</th>
              <th class="col-acciones">Acciones</th>
            </tr>
          </thead>
          <tbody id="tbodyClientes">
            <tr>
              <td colspan="6">
                <div class="empty-state">
                  <span class="empty-icon">👥</span>
                  <span>Cargando clientes…</span>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- ===== MODAL: Cliente ===== -->
  <dialog id="dlg-cliente" class="dlg">
    <div class="dlg-card">
      <div class="dlg-head">
        <h2 id="modalTitle">👤 Nuevo cliente</h2>
        <button id="cerrarModal" class="dlg-close">✕</button>
      </div>
      <div class="dlg-body">
        <form id="formCliente" autocomplete="off">
          <input type="hidden" id="clienteId"/>
          <div class="form-grid">
            <div class="field form-full">
              <label class="field-label">Nombre *</label>
              <input id="nombre" class="field-input" required placeholder="Nombre completo del cliente"/>
            </div>
            <div class="field">
              <label class="field-label">Email</label>
              <input id="email" class="field-input" type="email" placeholder="correo@ejemplo.com"/>
            </div>
            <div class="field">
              <label class="field-label">Teléfono</label>
              <input id="telefono" class="field-input" placeholder="Ej: 381 555-1234"/>
            </div>
            <div class="field">
              <label class="field-label">DNI</label>
              <input id="dni" class="field-input" placeholder="12345678"/>
            </div>
            <div class="field">
              <label class="field-label">Dirección</label>
              <input id="direccion" class="field-input" placeholder="Calle, número, ciudad"/>
            </div>
          </div>
        </form>
      </div>
      <div class="dlg-actions">
        <button id="btn-guardar-cliente" class="btn btn-primary">Guardar cliente</button>
        <button type="button" class="btn btn-outline" onclick="document.getElementById('dlg-cliente').close()">Cancelar</button>
      </div>
    </div>
  </dialog>

  <!-- ===== MODAL: Historial ===== -->
  <dialog id="dlg-historial" class="dlg dlg-wide">
    <div class="dlg-card">
      <div class="dlg-head">
        <h2>📋 Historial de compras</h2>
        <button id="cerrarHistorial" class="dlg-close">✕</button>
      </div>
      <div class="dlg-body">
        <div id="historialContent"></div>
      </div>
      <div class="dlg-actions">
        <button class="btn btn-outline" onclick="document.getElementById('dlg-historial').close()">Cerrar</button>
      </div>
    </div>
  </dialog>

  <!-- ===== MODAL: Cuenta Corriente ===== -->
  <dialog id="dlg-cuenta" class="dlg dlg-wide">
    <div class="dlg-card">
      <div class="dlg-head">
        <h2>💳 Cuenta Corriente</h2>
        <button id="cerrarCuenta" class="dlg-close">✕</button>
      </div>
      <div class="dlg-body">
        <div id="cuentaContent"></div>
      </div>
      <div class="dlg-actions">
        <button class="btn btn-outline" onclick="document.getElementById('dlg-cuenta').close()">Cerrar</button>
      </div>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/clientes.js"></script>
</body>
</html>
